name: Refresh lender prices

on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 06:00 EAT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape-lenders.mjs
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      - name: Commit updated prices
        run: |
          git config user.name "lender-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/lender-products.json
          git diff --cached --quiet || git commit -m "Refresh lender prices"
          git push
